name: Build image

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/svantetobias/connectome
  UPSTREAM: anima-research/connectome-host

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$UPSTREAM/releases/latest" -q .tag_name 2>/dev/null || true)
          [ -n "$tag" ] || tag=$(gh api "repos/$UPSTREAM/tags" -q '.[0].name' 2>/dev/null || true)
          if [ -n "$tag" ]; then
            ref="$tag"
            sha=$(gh api "repos/$UPSTREAM/commits/$tag" -q .sha)
            version="${tag#v}"
          else
            branch=$(gh api "repos/$UPSTREAM" -q .default_branch)
            sha=$(gh api "repos/$UPSTREAM/commits/$branch" -q .sha)
            pkg=$(gh api "repos/$UPSTREAM/contents/package.json?ref=$sha" -q .content | base64 -d | jq -r .version)
            ref="$sha"
            version="${pkg}-${sha:0:7}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Upstream ref=$ref version=$version sha=$sha"

      - name: Check if tag already exists
        id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide
        id: go
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.exists.outputs.exists }}" = "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE:${{ steps.ver.outputs.version }} already exists; skipping."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.go.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.go.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.go.outputs.build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=sha-${{ steps.ver.outputs.short }}
          labels: |
            org.opencontainers.image.title=connectome
            org.opencontainers.image.description=Unofficial container for Anima Labs connectome-host
            org.opencontainers.image.source=https://github.com/svantetobias/connectome-docker
            org.opencontainers.image.url=https://github.com/anima-research/connectome-host
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ steps.ver.outputs.sha }}

      - uses: docker/build-push-action@v6
        if: steps.go.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            UPSTREAM_REF=${{ steps.ver.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
